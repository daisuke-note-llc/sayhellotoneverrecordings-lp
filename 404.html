<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not Found｜SAY HELLO TO NEVER RECORDINGS</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .notfound {
      min-height: 100svh;
      padding: var(--page-padding);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      color: var(--white);
      background: var(--ink);
    }
    .notfound h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 6rem);
      font-weight: 800;
      line-height: 0.98;
      letter-spacing: -0.06em;
    }
    .notfound p { margin: 1.75rem 0 0; color: #d7d5cf; }
  </style>
</head>
<body>
  <main class="notfound">
    <p class="eyebrow">ERROR 404</p>
    <h1>Page not found.<br>ページが見つかりません。</h1>
    <p>URLが変更されたか、削除された可能性があります。</p>
    <div class="hero-actions">
      <a class="button button-primary" href="/">トップへ戻る / HOME</a>
    </div>
  </main>
</body>
</html>
